<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="stylesheet" href="../css/style.css" />
	<link rel="stylesheet" href="../css/header.css" />
	<link rel="stylesheet" href="../css/login.css" />
	<title>Recupero Password — Trovami</title>
</head>

<body>
	<div data-include="header"></div>

	<main class="auth-page">
		<div class="auth-card">

			<div class="auth-brand">
				<div class="auth-brand-icon">🐾</div>
				<span class="auth-brand-name">TrovaMi</span>
			</div>

			<h1>Recupera password</h1>
			<p class="auth-subtitle">Inserisci la tua email per ricevere un link di recupero.</p>

			<div class="auth-divider"></div>

			<form id="forgotPasswordForm">
				<div class="field-group">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" required placeholder="nome@email.com" />
				</div>

				<button type="submit">Invia link</button>
				<div id="message" class="error" style="text-align:center;"></div>
			</form>

			<div class="auth-footer-links">
				<p>Ricordi la password? <a href="/pages/login.html">Torna al login</a></p>
			</div>

		</div>
	</main>

	<script src="/js/includes.js"></script>
	<div data-include="footer"></div>

	<script>
		document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
			e.preventDefault();
			const email = document.getElementById('email').value;
			const messageDiv = document.getElementById('message');

			messageDiv.textContent = '';

			try {
				const res = await fetch('http://localhost:3000/api/v1/auth/password-reset-requests', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ email })
				});

				const data = await res.json();

				if (res.ok) {
					messageDiv.style.color = 'var(--success, #0F6E56)';
					messageDiv.textContent = 'Email inviata! Controlla la tua posta.';
					document.getElementById('forgotPasswordForm').reset();
				} else {
					messageDiv.style.color = 'var(--error)';
					messageDiv.textContent = data.message || 'Errore nel recupero password';
				}
			} catch (err) {
				messageDiv.style.color = 'var(--error)';
				messageDiv.textContent = 'Errore di connessione';
				console.error(err);
			}
		});
	</script>
</body>

</html>
