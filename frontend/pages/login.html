<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/login.css" />
  <title>Login - Trovami</title>
</head>
<body>
  <div data-include="header"></div>

  <main class="auth-page">
    <form id="loginForm" class="auth-card">

      <div class="auth-brand">
        
        <span class="auth-brand-name">Trovami</span>
      </div>

      <h1>Bentornato</h1>
      <p class="auth-subtitle">Accedi per continuare la ricerca.</p>

      <div class="auth-divider"></div>

      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nome@email.com" required />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="La tua password" required />
      </div>

      <button type="submit">Entra</button>
      <p id="loginError" class="error"></p>

      <div class="auth-footer-links">
        <p>Non hai ancora un account? <a href="register.html">Registrati</a></p>
        <p><a href="forgot-password.html">Ho dimenticato la password</a></p>
      </div>

    </form>
  </main>

  <script src="/js/includes.js"></script>
  <div data-include="footer"></div>

  <script src="../js/login.js"></script>
</body>
</html>
